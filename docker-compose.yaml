version: '3.8'

x-airflow-common: &airflow-common
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'Europe/Paris'
    AIRFLOW_UID: ${AIRFLOW_UID:-5000}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - .:/opt/airflow
    - /var/tmp:/var/tmp
  user: "${AIRFLOW_UID:-5000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  mini-serv-flask:
    <<: *airflow-common
    container_name: mini-serv-flask
    command: bash -c "pip install flask && flask --app mini_serv run -h 0.0.0.0 -p 8181"
    ports:
      - "8181:8181"

  mini-serv-fastapi:
    <<: *airflow-common
    container_name: mini-serv-fastapi
    command: bash -c "pip install fastapi uvicorn sqlalchemy && uvicorn mini_serv2:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  # --- Dashboard Homer ---
  homer:
    image: b4bz/homer
    container_name: homer
    volumes:
      - ./config:/www/assets
    ports:
      - "80:8080"
    user: "${AIRFLOW_UID:-5000}:0"
    restart: always

volumes:
  postgres-db-volume:
  